[package]
name = "whip-ssh"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Private WP4 pairing transport for Whip"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
futures = "0.3"
hmac = "0.12"
num-bigint = "0.4"
parking_lot = "0.12"
ring = "0.17"
russh = { version = "0.63.1", default-features = false, features = ["flate2", "ring"] }
russh-sftp = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha1 = "0.10"
shlex = "2"
ssh-key = { version = "=0.7.0-rc.11", features = ["ed25519", "getrandom"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "net", "rt-multi-thread", "sync", "time"] }
uniffi = "=0.31"
url = "2"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
excessive_nesting = "warn"
expect_used = "deny"
large_futures = "warn"
large_stack_arrays = "warn"
doc_markdown = "allow"
ignored_unit_patterns = "allow"
if_not_else = "allow"
map_unwrap_or = "allow"
missing_errors_doc = "allow"
multiple_unsafe_ops_per_block = "deny"
mutex_atomic = "warn"
mutex_integer = "warn"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
needless_collect = "deny"
redundant_clone = "deny"
similar_names = "allow"
significant_drop_tightening = "warn"
single_match_else = "allow"
struct_excessive_bools = "allow"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unwrap_used = "deny"
wildcard_imports = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
