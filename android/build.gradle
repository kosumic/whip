buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        if (file("app/google-services.json").exists() || System.getenv("WHIP_GOOGLE_SERVICES_JSON")) {
            classpath("com.google.gms:google-services:4.5.0")
        }
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url = uri("https://www.jitpack.io")
        }
    }

}

def nodeModulesDir = rootProject.file("../node_modules").canonicalFile.toPath()

subprojects { subproject ->
    if (subproject.projectDir.canonicalFile.toPath().startsWith(nodeModulesDir)) {
        subproject.tasks.configureEach { task ->
            if (task.name.startsWith("lintAnalyze")) {
                task.enabled = false
            }
        }
    }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
