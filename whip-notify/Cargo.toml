[package]
name = "whip-notify"
version = "0.1.4"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/kosumic/whip"

[features]
default = ["host"]
host = ["dep:ureq", "dep:fs2", "dep:libc"]

[dependencies]
base64 = "0.22"
hpke-rs = { version = "=0.8.0", features = ["rustcrypto", "hazmat"] }
libc = { version = "0.2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1", features = ["derive"] }
ureq = { version = "3", optional = true, features = ["json"] }
fs2 = { version = "0.4", optional = true }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "whip-notify"
path = "src/main.rs"
required-features = ["host"]

[profile.release]
strip = true
