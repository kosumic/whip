id = "dev.whip.notify"
name = "Whip encrypted notifications"
version = "0.1.2"
min_herdr_version = "0.9.5"
platforms = ["linux", "macos"]
description = "Optional encrypted mobile push with file-based delivery leases"

[[build]]
command = ["sh", "build.sh"]

[[events]]
on = "pane.agent_status_changed"
command = ["./whip-notify", "hook"]

[[actions]]
id = "paths"
title = "Whip notification configuration"
command = ["./whip-notify", "paths"]
