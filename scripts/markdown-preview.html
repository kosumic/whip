<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <base href="file:///android_asset/">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data: https: http:; font-src 'self'">
  <style>
    @font-face { font-family: WhipInter; src: url('markdown-Inter-Regular.ttf'); font-weight: 400; }
    @font-face { font-family: WhipInter; src: url('markdown-Inter-Bold.ttf'); font-weight: 700; }
    * { box-sizing: border-box; }
    html { color-scheme: dark; overflow-wrap: anywhere; }
    body { margin: 0; padding: 20px; background: var(--canvas); color: var(--foreground); font: 15px/1.6 WhipInter, system-ui, sans-serif; }
    main > :first-child { margin-top: 0; }
    p, ul, ol, pre, table, blockquote { margin: 0 0 16px; }
    h1, h2, h3, h4, h5, h6 { line-height: 1.3; margin: 24px 0 16px; }
    h1 { font-size: 28px; } h2 { font-size: 23px; } h3 { font-size: 19px; }
    a { color: var(--link); text-decoration: underline; }
    img { max-width: 100%; height: auto; vertical-align: middle; }
    p[align="center"] img { margin: 4px 2px; }
    table { width: 100%; border-collapse: collapse; }
    td, th { padding: 8px; border: 1px solid var(--border); vertical-align: top; }
    td img, th img { max-width: 100%; }
    .diagram { overflow: auto; margin-bottom: 16px; }
    .diagram svg { max-width: 100%; height: auto; }
    .table-scroll { overflow-x: auto; margin-bottom: 16px; }
    .table-scroll table { margin-bottom: 0; }
    table.image-table { table-layout: fixed; }
    pre { padding: 12px; overflow: auto; background: var(--surface); border-radius: 6px; }
    code { font: 13px/1.5 monospace; } :not(pre) > code { background: var(--surface); padding: 2px 4px; border-radius: 3px; }
    blockquote { border-left: 3px solid var(--border); padding-left: 14px; color: var(--muted); }
    hr { border: 0; border-top: 1px solid var(--border); margin: 24px 0; }
    input[type="checkbox"] { pointer-events: none; }
  </style>
</head>
<body>
  <main id="markdown"></main>
  <script src="marked.umd.js"></script>
  <script src="purify.min.js"></script>
  <script src="markdown-preview.js"></script>
</body>
</html>
