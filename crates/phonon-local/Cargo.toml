[package]
name = "phonon-local"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "AGPL-3.0-or-later"
description = "Verified Phonon artifacts and streaming local speech, maintained by Whip"
repository = "https://github.com/kosumic/whip"
readme = "README.md"

[dependencies]
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
fs2 = "0.4"
tokio = { version = "1", features = ["rt", "time", "net"] }

[target.'cfg(not(target_os = "ios"))'.dependencies]
ptts = { version = "=0.6.0", default-features = false, features = ["hf"] }

[target.'cfg(target_os = "ios")'.dependencies]
ptts-ffi = { git = "https://github.com/gradium-ai/xn-ptts", rev = "cf90537f4599fb5ae6b09ac88258ce69e8e2f133" }
zip = { version = "=9.0.5", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
zip = { version = "=9.0.5", default-features = false, features = ["deflate"] }

[lints.clippy]
undocumented_unsafe_blocks = "deny"
