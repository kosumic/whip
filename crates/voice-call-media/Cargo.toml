[package]
name = "voice-call-media"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-or-later"
description = "Provider-neutral bounded native PCM, WebRTC/Opus transport and echo processing"
repository = "https://github.com/kosumic/whip"

[features]
# Enables upstream SPED diagnostics in the host-local benchmark. Keeping these
# hooks behind a feature also lets the same harness run against stock 0.25.0.
sped-benchmark = []

[dependencies]
audio-ingress = { version = "0.1.0", path = "../audio-ingress" }
opus = "=0.4.0"
# Provider-backed DTLS avoids crypto-bigint 0.5 (RUSTSEC-2026-0387).
# Temporary immutable upstream-PR pin; return to a release after SPED lands.
str0m = { git = "https://github.com/kosumic/str0m", rev = "51b8a99b1262b249b7f84b2df1ec3cc810b6cc77", version = "=0.25.0", default-features = false, features = ["aws-lc-rs"] }
if-addrs = "0.15"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sonora = { version = "=0.2.0", default-features = false }
rubato = { version = "=5.0.0", default-features = false }
tokio = { version = "1", features = ["io-util", "net", "rt", "sync", "time", "macros"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
futures = "0.3"
rtc = "=0.21.1"
webrtc = "=0.21.1"
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }

[lints.rust]
unsafe_code = "forbid"
