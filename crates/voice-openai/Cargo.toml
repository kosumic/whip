[package]
name = "voice-openai"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-or-later"
description = "Reusable OpenAI Realtime and GPT-Live native voice provider"
repository = "https://github.com/kosumic/whip"

[dependencies]
voice-call-media = { version = "0.1.0", path = "../voice-call-media" }
audio-ingress = { version = "0.1.0", path = "../audio-ingress" }
native-credentials = { path = "../native-credentials" }
zeroize = "1"
oai-rt-rs = "=0.5.1"
futures = "0.3"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "multipart", "json"] }
tokio = { version = "1", features = ["net", "rt", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }

[lints.rust]
unsafe_code = "forbid"
