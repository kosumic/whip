[package]
name = "tailcat-client"
version = "0.1.1"
edition = "2024"
rust-version = "1.99"
license = "MIT"
description = "Client-only Tailcat transport with WireGuard, DERP, and userspace TCP"
repository = "https://github.com/kosumic/whip"
documentation = "https://docs.rs/tailcat-client"
readme = "README.md"
keywords = ["tailcat", "wireguard", "derp", "tcp", "async"]
categories = ["network-programming", "asynchronous"]

[features]
default = ["transport"]
transport = [
    "dep:boringtun",
    "dep:crypto_box",
    "dep:futures-util",
    "dep:hmac",
    "dep:if-addrs",
    "dep:rand",
    "dep:reqwest",
    "dep:rustls",
    "dep:rustls-native-certs",
    "dep:serde_json",
    "dep:sha2",
    "dep:smoltcp",
    "dep:socket2",
    "dep:tokio",
    "dep:tokio-rustls",
    "dep:tokio-util",
    "dep:tracing",
    "dep:webpki-roots",
    "dep:x25519-dalek",
    "dep:zeroize",
]

[dependencies]
anyhow = "1"
base64 = "0.22"
boringtun = { optional = true, version = "0.7.1", default-features = false }
ciborium = "0.2"
crypto_box = { optional = true, version = "0.9", features = ["salsa20", "getrandom"] }
futures-util = { version = "0.3", optional = true }
hex = "0.4"
hmac = { version = "0.12", optional = true }
if-addrs = { version = "0.15", optional = true }
rand = { version = "0.8", optional = true }
reqwest = { optional = true, version = "0.12", default-features = false, features = ["rustls-tls"] }
rustls = { optional = true, version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-native-certs = { version = "0.8", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
smoltcp = { optional = true, version = "0.14", default-features = false, features = ["std", "medium-ip", "proto-ipv6", "socket-tcp", "socket-tcp-cubic"] }
socket2 = { version = "0.6", optional = true }
tokio = { optional = true, version = "1", features = ["io-util", "net", "rt", "sync", "time", "macros"] }
tokio-rustls = { optional = true, version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = { optional = true, version = "0.7", features = ["rt"] }
tracing = { version = "0.1", optional = true }
webpki-roots = { version = "1", optional = true }
x25519-dalek = { optional = true, version = "2", features = ["static_secrets"] }
zeroize = { optional = true, version = "1", features = ["derive"] }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring", "crypto"] }
tokio = { version = "1", features = ["process", "rt-multi-thread", "test-util"] }

[[test]]
name = "interop"
required-features = ["transport"]

[[test]]
name = "ios_simulator"
required-features = ["transport"]

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
