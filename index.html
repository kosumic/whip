<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <meta
      name="description"
      content="Download Whip, the open-source SSH client for Android, iPhone, and iPad, with native Herdr workflows for Claude Code, Codex, OpenCode, and Pi."
    />
    <title>Download Whip — Mobile SSH &amp; AI Coding Agents</title>
    <link rel="canonical" href="https://kosumic.github.io/whip/" />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Download Whip for Android, iPhone, and iPad"
    />
    <meta
      property="og:description"
      content="Open-source mobile SSH and native Herdr workflows for Claude Code, Codex, OpenCode, and Pi."
    />
    <meta property="og:url" content="https://kosumic.github.io/whip/" />
    <meta
      property="og:image"
      content="https://whip.kosumi.dev/assets/social.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="https://whip.kosumi.dev/assets/social.png"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="store-redirect.js" defer></script>
  </head>
  <body>
    <main>
      <div class="intro">
        <p class="eyebrow">YOUR WORKSPACE. WITH YOU.</p>
        <h1>Get Whip.</h1>
        <p class="description">
          Open-source SSH for Android, iPhone, and iPad. Follow Claude Code,
          Codex, OpenCode, and Pi with native Herdr workflows.
        </p>
        <p id="status" role="status">Choose your store to get started.</p>
        <nav aria-label="Download Whip">
          <a
            id="play-store"
            class="store-badge google-play-badge"
            href="https://play.google.com/store/apps/details?id=io.github.kaminarios.whip"
          >
            <img
              src="google-play.png"
              width="202"
              height="78"
              alt="Get Whip on Google Play"
            />
          </a>
          <a
            id="app-store"
            class="store-badge"
            href="https://apps.apple.com/app/id6808226150"
          >
            <img
              src="app-store.svg"
              width="156"
              height="52"
              alt="Download Whip Herd on the App Store"
            />
          </a>
        </nav>
        <p class="about-link">
          <a href="https://whip.kosumi.dev/"
            >About Whip, features, and setup
            <span aria-hidden="true">↗</span></a
          >
        </p>
        <noscript>
          <p>Tap your store above to download Whip.</p>
        </noscript>
      </div>
      <figure>
        <img
          src="whip-install-qr.svg"
          width="256"
          height="256"
          alt="Scan to get Whip on Google Play or the App Store"
        />
      </figure>
    </main>
  </body>
</html>
