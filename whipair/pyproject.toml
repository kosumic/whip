[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "whipair"
dynamic = ["version"]
description = "Direct, QR-based SSH public-key enrollment prototype for Whip"
readme = "README.md"
requires-python = ">=3.8"
license = "AGPL-3.0-or-later"
authors = [{ name = "kosumic" }]
keywords = ["ssh", "qr-code", "authorized-keys", "pairing", "cli"]
classifiers = [
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Rust",
  "Topic :: Security",
  "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/kosumic/whip/tree/main/whipair"
Repository = "https://github.com/kosumic/whip"
Issues = "https://github.com/kosumic/whip/issues"

[tool.maturin]
bindings = "bin"
strip = true
