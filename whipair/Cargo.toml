[package]
name = "whipair"
version = "0.1.3"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
description = "Direct, QR-based SSH public-key enrollment prototype for Whip"
repository = "https://github.com/kosumic/whip"
readme = "README.md"
keywords = ["ssh", "qr-code", "authorized-keys", "pairing", "cli"]
categories = ["authentication", "command-line-utilities"]
publish = ["crates-io"]
exclude = ["/npm", "/pyproject.toml"]

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
if-addrs = "0.13"
libc = "0.2"
qrcode = { version = "0.14", default-features = false }
rand = "0.8"
russh = { version = "=0.62.6", default-features = false, features = ["flate2", "ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ssh-key = { version = "=0.7.0-rc.11", default-features = false, features = ["ecdsa", "ed25519", "std"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
excessive_nesting = "warn"
expect_used = "deny"
large_futures = "warn"
large_stack_arrays = "warn"
doc_markdown = "allow"
ignored_unit_patterns = "allow"
if_not_else = "allow"
map_unwrap_or = "allow"
missing_errors_doc = "allow"
multiple_unsafe_ops_per_block = "deny"
mutex_atomic = "warn"
mutex_integer = "warn"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
needless_collect = "deny"
redundant_clone = "deny"
similar_names = "allow"
significant_drop_tightening = "warn"
single_match_else = "allow"
struct_excessive_bools = "allow"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unwrap_used = "deny"
wildcard_imports = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true
