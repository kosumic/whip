version: 2

updates:
  - package-ecosystem: npm
    directory: /
    cooldown:
      default-days: 1
    open-pull-requests-limit: 8
    schedule:
      interval: daily
    groups:
      # Beta addons declare peer ranges on core; update the family together.
      xterm:
        applies-to: version-updates
        patterns:
          - '@xterm/*'
      revenuecat:
        applies-to: version-updates
        patterns:
          - react-native-purchases
          - react-native-purchases-ui
      typescript-eslint:
        applies-to: version-updates
        patterns:
          - '@typescript-eslint/*'
      react-native-cli:
        applies-to: version-updates
        patterns:
          - '@react-native-community/cli*'
      expo-patches:
        applies-to: version-updates
        patterns:
          - expo
          - 'expo-*'
        update-types:
          - patch
      npm-patches:
        applies-to: version-updates
        patterns:
          - '*'
        exclude-patterns:
          - '@xterm/*'
          - react-native-purchases
          - react-native-purchases-ui
          - '@typescript-eslint/*'
          - '@react-native-community/cli*'
          - expo
          - 'expo-*'
        update-types:
          - patch
    ignore:
      # Upgrade the Expo SDK deliberately; keep SDK patch updates grouped above.
      - dependency-name: expo
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'expo-*'
        versions: ['>= 59.0.0']
      - dependency-name: babel-preset-expo
        versions: ['>= 59.0.0']
      # Expo SDK 58 owns these native/React versions. Update these bounds with
      # `npx expo install --fix` when upgrading the SDK, not independently.
      - dependency-name: '@react-native-async-storage/async-storage'
        versions: ['> 2.2.0']
      - dependency-name: '@react-native-community/slider'
        versions: ['> 5.2.1']
      - dependency-name: '@shopify/flash-list'
        versions: ['> 2.3.2']
      - dependency-name: react
        versions: ['> 19.3.0']
      - dependency-name: react-dom
        versions: ['> 19.3.0']
      - dependency-name: react-test-renderer
        versions: ['> 19.3.0']
      - dependency-name: react-native
        versions: ['> 0.88.0']
      - dependency-name: react-native-keyboard-controller
        versions: ['> 1.22.7']
      - dependency-name: react-native-reanimated
        versions: ['> 4.7.1']
      - dependency-name: react-native-safe-area-context
        versions: ['>= 5.11.0']
      - dependency-name: react-native-svg
        versions: ['> 15.16.0']
      - dependency-name: react-native-webview
        versions: ['> 14.0.1']
      - dependency-name: react-native-worklets
        versions: ['> 0.13.0']
      # Metro and the Jest preset must stay aligned with React Native above.
      - dependency-name: '@react-native/jest-preset'
        versions: ['> 0.88.0']
      - dependency-name: '@react-native/metro-config'
        versions: ['> 0.88.0']
      # React Native 0.88 only accepts ESLint 8 or 9.
      - dependency-name: eslint
        versions:
          - '>= 10.0.0'

  - package-ecosystem: gradle
    directory: /android
    cooldown:
      default-days: 1
    ignore:
      # Newer Gradle embeds Kotlin metadata the current RN/Expo plugins cannot
      # compile. Upgrade the wrapper together with those plugins.
      - dependency-name: gradle-wrapper
        versions: ['> 9.4.1']
    schedule:
      interval: weekly
      day: monday
    groups:
      gradle-dependencies:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 1
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - '*'
