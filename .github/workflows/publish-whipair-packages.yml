name: Publish whipair packages

on:
  push:
    tags:
      - 'whipair-v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version from whipair/Cargo.toml, without a leading v
        required: true
        default: 0.1.4
        type: string
      publish_pypi:
        description: Publish the PyPI wheels
        required: true
        default: true
        type: boolean
      publish_npm:
        description: Publish the npm package
        required: true
        default: false
        type: boolean
      publish_github:
        description: Publish Linux x64 and macOS arm64 binaries to GitHub Releases
        required: true
        default: false
        type: boolean
      bootstrap_npm_with_token:
        description: Bootstrap the first npm release with NPM_TOKEN
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-whipair-packages
  cancel-in-progress: false

jobs:
  verify:
    name: Verify source package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: whipair
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      revision: ${{ steps.version.outputs.revision }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.publish_github && format('refs/tags/whipair-v{0}', inputs.version) || github.ref }}

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install
          rustc --version

      - name: Verify release versions
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cargo_version="$(cargo metadata --locked --format-version 1 --no-deps \
            | jq -r '.packages[0].version')"
          npm_version="$(node -p "require('./npm/package.json').version")"
          if [[ "$EVENT_NAME" == "push" ]]; then
            expected_version="${RELEASE_TAG#whipair-v}"
          else
            expected_version="$MANUAL_VERSION"
          fi
          if [[ -z "$expected_version" || "$cargo_version" != "$expected_version" ]]; then
            echo "Expected whipair version $expected_version, found $cargo_version" >&2
            exit 1
          fi
          if [[ "$npm_version" != "$cargo_version" ]]; then
            echo "npm version $npm_version does not match Cargo version $cargo_version" >&2
            exit 1
          fi
          printf 'version=%s\ntag=whipair-v%s\n' "$cargo_version" "$cargo_version" >> "$GITHUB_OUTPUT"
          printf 'revision=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Check npm launcher syntax
        run: |
          node --check npm/bin/whipair.js
          node --check npm/scripts/verify-package.js

  build:
    name: Build ${{ matrix.package_target }} packages
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            rust_target: x86_64-unknown-linux-musl
            wheel_target: x86_64
            package_target: linux-x64
            is_linux: true
          - runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
            wheel_target: aarch64
            package_target: linux-arm64
            is_linux: true
          - runner: macos-15-intel
            rust_target: x86_64-apple-darwin
            wheel_target: x86_64
            package_target: darwin-x64
            is_linux: false
          - runner: macos-26
            rust_target: aarch64-apple-darwin
            wheel_target: aarch64
            package_target: darwin-arm64
            is_linux: false

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify.outputs.revision }}

      - name: Install pinned Rust toolchain
        id: rust
        run: |
          rustup toolchain install
          rustup target add "${{ matrix.rust_target }}"
          rustc --version
          echo "toolchain=$(rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"

      - name: Install musl compiler
        if: matrix.is_linux
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Build native binary
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
          PACKAGE_TARGET: ${{ matrix.package_target }}
        run: |
          if [[ "${{ matrix.is_linux }}" == "true" ]]; then
            target_key="${RUST_TARGET^^}"
            target_key="${target_key//-/_}"
            export "CC_${RUST_TARGET//-/_}=musl-gcc"
            export "CARGO_TARGET_${target_key}_LINKER=musl-gcc"
          fi
          cargo build --release --locked \
            --manifest-path whipair/Cargo.toml \
            --target "$RUST_TARGET"
          mkdir -p "whipair/npm/vendor/$PACKAGE_TARGET"
          install -m 755 \
            "whipair/target/$RUST_TARGET/release/whipair" \
            "whipair/npm/vendor/$PACKAGE_TARGET/whipair"
          "whipair/npm/vendor/$PACKAGE_TARGET/whipair" --version
          tar -czf "$RUNNER_TEMP/native-$PACKAGE_TARGET.tar.gz" \
            -C whipair/npm "vendor/$PACKAGE_TARGET"

      - name: Build manylinux wheel
        if: matrix.is_linux
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.wheel_target }}
          manylinux: '2014'
          rust-toolchain: ${{ steps.rust.outputs.toolchain }}
          working-directory: whipair
          args: --release --locked --out dist

      - name: Build macOS wheel
        if: ${{ !matrix.is_linux }}
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.wheel_target }}
          rust-toolchain: ${{ steps.rust.outputs.toolchain }}
          working-directory: whipair
          args: --release --locked --out dist

      - name: Upload native npm binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-${{ matrix.package_target }}
          path: ${{ runner.temp }}/native-${{ matrix.package_target }}.tar.gz
          if-no-files-found: error
          retention-days: 3

      - name: Upload wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wheel-${{ matrix.package_target }}
          path: whipair/dist/*.whl
          if-no-files-found: error
          retention-days: 3

  publish-github:
    name: Publish binaries to GitHub Releases
    needs: [verify, build]
    if: github.event_name == 'push' || inputs.publish_github == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.verify.outputs.tag }}
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
      RELEASE_REVISION: ${{ needs.verify.outputs.revision }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify.outputs.revision }}

      - name: Verify release tag and draft
        run: |
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
          if [[ "$(git rev-parse 'FETCH_HEAD^{commit}')" != "$RELEASE_REVISION" ]]; then
            echo "Release tag $RELEASE_TAG must point at the verified build commit" >&2
            exit 1
          fi
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$draft" != true ]]; then
              echo 'Release is already published; increment the version instead of replacing binaries' >&2
              exit 1
            fi
          fi

      - name: Download native binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: native-*
          path: native-dist
          merge-multiple: true

      - name: Package Linux x64 and macOS arm64 downloads
        run: |
          mkdir -p dist
          for target in linux-x64 darwin-arm64; do
            tar -xzf "native-dist/native-$target.tar.gz" -C native-dist
            staging="$RUNNER_TEMP/whipair-$target"
            mkdir -p "$staging"
            install -m 755 "native-dist/vendor/$target/whipair" "$staging/whipair"
            cp whipair/README.md LICENSE "$staging/"
            tar -czf "dist/whipair-$RELEASE_VERSION-$target.tar.gz" \
              -C "$staging" whipair README.md LICENSE
          done
          cd dist
          for archive in ./*.tar.gz; do
            sha256sum "$archive" > "$archive.sha256"
          done
          sha256sum --check --strict ./*.sha256

      - name: Publish complete GitHub release
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            cat > "$RUNNER_TEMP/whipair-release-notes.md" <<'EOF'
          Prebuilt Whip SSH pairing helper for Linux x86_64 (static musl) and Apple Silicon macOS.

          Extract the archive for your platform and run `./whipair`. OpenSSH's `ssh-keyscan` must be available on `PATH`. No Rust, Node.js, or Python installation is required.

          Each archive includes the README and license. Download its matching `.sha256` file to verify it with `sha256sum --check ARCHIVE.tar.gz.sha256` (Linux) or `shasum -a 256 --check ARCHIVE.tar.gz.sha256` (macOS).
          EOF
            gh release create "$RELEASE_TAG" --verify-tag --draft --latest=false \
              --title "Whipair $RELEASE_VERSION" \
              --notes-file "$RUNNER_TEMP/whipair-release-notes.md"
          fi
          gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/*.sha256 --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest=false

  publish-pypi:
    name: Publish wheels to PyPI
    needs: build
    if: github.event_name == 'push' || inputs.publish_pypi == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Publish with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          skip-existing: true

  publish-npm:
    name: Publish native package to npm
    needs: [verify, build]
    if: github.event_name == 'push' || inputs.publish_npm == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify.outputs.revision }}

      - name: Set up Node.js for trusted publishing
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download native binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: native-*
          path: native-dist
          merge-multiple: true

      - name: Assemble and verify npm package
        run: |
          for archive in native-dist/*.tar.gz; do
            tar -xzf "$archive" -C whipair/npm
          done
          chmod +x whipair/npm/bin/whipair.js whipair/npm/vendor/*/whipair
          node whipair/npm/scripts/verify-package.js
          node whipair/npm/bin/whipair.js --version
          npm pack ./whipair/npm --dry-run

      - name: Publish with npm trusted publishing
        if: github.event_name == 'push' || inputs.bootstrap_npm_with_token == false
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if npm view "whipair@$package_version" version >/dev/null 2>&1; then
            echo "whipair@$package_version is already published to npm"
          else
            npm publish
          fi
        working-directory: whipair/npm

      - name: Bootstrap first npm release with API token
        if: github.event_name == 'workflow_dispatch' && inputs.bootstrap_npm_with_token == true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -z "$NODE_AUTH_TOKEN" ]]; then
            echo "Missing npm environment secret NPM_TOKEN" >&2
            exit 1
          fi
          package_version="$(node -p "require('./package.json').version")"
          if npm view "whipair@$package_version" version >/dev/null 2>&1; then
            echo "whipair@$package_version is already published to npm"
          else
            npm publish
          fi
        working-directory: whipair/npm
