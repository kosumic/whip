name: Dependabot auto-merge

on:
  workflow_run:
    workflows:
      - CI
      - Whipair CI
      - Whip Notify CI
      - Feedback Worker CI
      - Notify Relay CI
    types:
      - completed

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Merge successful Dependabot update
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.pull_requests[0].number
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Merge the tested Dependabot pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          TESTED_HEAD_SHA: ${{ github.event.workflow_run.pull_requests[0].head.sha }}
        run: |
          author="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json author --jq '.author.login')"
          state="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state --jq '.state')"
          head_sha="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')"

          if [[ "$author" != 'app/dependabot' && "$author" != 'dependabot[bot]' ]]; then
            echo "Skipping PR #$PR_NUMBER from $author"
            exit 0
          fi
          if [[ "$state" != 'OPEN' ]]; then
            echo "Skipping PR #$PR_NUMBER because it is $state"
            exit 0
          fi
          if [[ "$head_sha" != "$TESTED_HEAD_SHA" ]]; then
            echo "Skipping PR #$PR_NUMBER because its head changed after CI"
            exit 0
          fi

          # A shared-library or mixed-project PR can start several CI workflows.
          # The last successful workflow retries this check when the others finish.
          ci_passed="$(gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs?event=pull_request&head_sha=$TESTED_HEAD_SHA&per_page=100" \
            --jq '[.[].workflow_runs[] | select(
              .path == ".github/workflows/ci.yml" or
              .path == ".github/workflows/ci-whipair.yml" or
              .path == ".github/workflows/ci-whip-notify.yml" or
              .path == ".github/workflows/ci-feedback-worker.yml" or
              .path == ".github/workflows/ci-notify-relay.yml"
            )] | group_by(.workflow_id) | map(max_by(.run_number)) |
            length > 0 and all(.conclusion == "success")')"
          if [[ "$ci_passed" != 'true' ]]; then
            echo "Skipping PR #$PR_NUMBER because another CI workflow is pending or failed"
            exit 0
          fi

          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --match-head-commit "$TESTED_HEAD_SHA" \
            --squash \
            --delete-branch
