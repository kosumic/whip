name: Agent transcript view CI

on:
  push:
    branches: [main]
    paths: &view-paths
      - 'crates/agent-transcript-view/**'
      - 'crates/agent-transcript-core/**'
      - '.github/workflows/ci-agent-transcript-view.yml'
      - 'rust-toolchain.toml'
  pull_request:
    branches: [main]
    paths: *view-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-agent-transcript-view-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Standalone view (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: crates/agent-transcript-view
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: crates/agent-transcript-view
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo run --locked --example minimal
