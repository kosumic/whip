name: Agent transcripts CI

on:
  push:
    branches: [main]
    paths: &transcript-paths
      - 'crates/agent-transcript-core/**'
      - '.github/workflows/ci-agent-transcript-core.yml'
      - '.github/workflows/publish-agent-transcript-core.yml'
      - 'rust-toolchain.toml'
  pull_request:
    branches: [main]
    paths: *transcript-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-agent-transcript-core-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Standalone crate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: crates/agent-transcript-core
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: crates/agent-transcript-core

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test all provider fixtures without Whip
        run: cargo test --locked

      - name: Run the offline ingestion example
        run: cargo run --locked --example ingest

      - name: Verify crates.io package
        run: cargo publish --locked --dry-run
