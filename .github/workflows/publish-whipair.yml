name: Publish whipair to crates.io

on:
  push:
    tags:
      - 'whipair-v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version from whipair/Cargo.toml, without a leading v
        required: true
        default: 0.1.3
        type: string
      bootstrap_with_token:
        description: Bootstrap first release with API token
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-whipair
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish crate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: whipair

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install
          rustc --version

      - name: Verify release version
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          actual_version="$(cargo metadata --locked --format-version 1 --no-deps \
            | jq -r '.packages[0].version')"
          if [[ "$EVENT_NAME" == "push" ]]; then
            expected_version="${RELEASE_TAG#whipair-v}"
          else
            expected_version="$MANUAL_VERSION"
          fi
          if [[ -z "$expected_version" || "$actual_version" != "$expected_version" ]]; then
            echo "Expected whipair version $expected_version, found $actual_version" >&2
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Verify crates.io package
        run: cargo publish --locked --dry-run

      - name: Authenticate with crates.io trusted publishing
        if: github.event_name == 'push' || inputs.bootstrap_with_token == false
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish with trusted publishing
        if: github.event_name == 'push' || inputs.bootstrap_with_token == false
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: cargo publish --locked

      - name: Bootstrap first release with API token
        if: github.event_name == 'workflow_dispatch' && inputs.bootstrap_with_token == true
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          if [[ -z "$CARGO_REGISTRY_TOKEN" ]]; then
            echo "Missing crates-io environment secret CRATES_IO_TOKEN" >&2
            exit 1
          fi
          cargo publish --locked
