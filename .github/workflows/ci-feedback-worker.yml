name: Feedback Worker CI

on:
  push:
    branches: [main]
    paths: &feedback-paths
      - 'feedback-worker/**'
      - '.github/workflows/ci-feedback-worker.yml'
  pull_request:
    branches: [main]
    paths: *feedback-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-feedback-worker-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Feedback Worker checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: feedback-worker
    env:
      WRANGLER_SEND_METRICS: 'false'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: feedback-worker/package-lock.json

      - name: Install Worker dependencies
        run: npm ci --include=dev

      - name: Check types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check Worker bindings
        run: npm run types:check

      - name: Check Worker packaging
        run: npm run build

      - name: Test
        run: npm test
