name: Herdr protocol CI

on:
  push:
    branches: [main]
    paths: &herdr-protocol-paths
      - 'crates/herdr-protocol/**'
      - '.github/workflows/ci-herdr-protocol.yml'
      - '.github/workflows/publish-herdr-protocol.yml'
      - 'rust-toolchain.toml'
  pull_request:
    branches: [main]
    paths: *herdr-protocol-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-herdr-protocol-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Standalone crate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: crates/herdr-protocol
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: crates/herdr-protocol

      - name: Check formatting
        run: cargo fmt --check

      - name: Check pinned OpenRPC models
        run: node scripts/generate-hc.cjs --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test wire, control, and event fixtures without Whip
        run: cargo test --locked

      - name: Run the offline protocol example
        run: cargo run --locked --example messages

      - name: Verify crates.io package
        run: cargo publish --locked --dry-run
