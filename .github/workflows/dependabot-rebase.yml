name: Dependabot rebase

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: dependabot-rebase
  cancel-in-progress: false

jobs:
  rebase:
    name: Refresh failed Dependabot updates after main recovers
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Let Dependabot push the rebased commit so it triggers fresh PR checks.
      # This privileged workflow never checks out or executes PR code.
      - name: Ask Dependabot to rebase failed, outdated pull requests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_MAIN_SHA: ${{ github.event.workflow_run.head_sha }}
          BASE_BRANCH: main
          CI_WORKFLOW: ci.yml
          REBASE_COMMAND: '@dependabot rebase'
        run: |
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/$BASE_BRANCH" --jq '.commit.sha')"
          if [[ -n "$TESTED_MAIN_SHA" && "$main_sha" != "$TESTED_MAIN_SHA" ]]; then
            echo "Skipping because $BASE_BRANCH advanced after this CI run"
            exit 0
          fi

          ci_runs="repos/$GITHUB_REPOSITORY/actions/workflows/$CI_WORKFLOW/runs"
          main_conclusion="$(gh api "$ci_runs?event=push&head_sha=$main_sha&per_page=1" \
            --jq '.workflow_runs[0].conclusion // "pending"')"
          if [[ "$main_conclusion" != 'success' ]]; then
            echo "Skipping because current $BASE_BRANCH CI is $main_conclusion"
            exit 0
          fi

          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&base=$BASE_BRANCH&per_page=100" \
            --jq '.[] | select(.user.login == "dependabot[bot]" and .draft == false and .head.repo.id == .base.repo.id) | [.number, .head.sha] | @tsv' |
          while IFS=$'\t' read -r pr_number head_sha; do
            conclusion="$(gh api "$ci_runs?event=pull_request&head_sha=$head_sha&per_page=1" \
              --jq '.workflow_runs[0].conclusion // "pending"')"
            if [[ "$conclusion" != 'failure' && "$conclusion" != 'timed_out' ]]; then
              echo "Skipping PR #$pr_number because its latest CI is $conclusion"
              continue
            fi

            behind="$(gh api "repos/$GITHUB_REPOSITORY/compare/$main_sha...$head_sha" --jq '.behind_by')"
            if (( behind == 0 )); then
              echo "Skipping PR #$pr_number because it already includes $BASE_BRANCH"
              continue
            fi

            # Deduplicate retries for the same base and PR head.
            marker="<!-- dependabot-rebase:$main_sha:$head_sha -->"
            requested="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$pr_number/comments?per_page=100" |
              jq --arg marker "$marker" 'any(.[][]; .user.login == "github-actions[bot]" and (.body | contains($marker)))')"
            if [[ "$requested" == 'true' ]]; then
              echo "Skipping PR #$pr_number because this rebase was already requested"
              continue
            fi

            # The PR may have changed while its CI and comments were inspected.
            current_head="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number" \
              --jq 'select(.state == "open" and .draft == false) | .head.sha')"
            if [[ "$current_head" != "$head_sha" ]]; then
              echo "Skipping PR #$pr_number because it changed during this run"
              continue
            fi

            body="$(printf '%s\n\nMain CI passed; refresh this failed update against %s.\n\n%s' \
              "$REBASE_COMMAND" "$main_sha" "$marker")"
            gh pr comment "$pr_number" --repo "$GITHUB_REPOSITORY" --body "$body"
          done
