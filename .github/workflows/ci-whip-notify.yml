name: Whip Notify CI

on:
  push:
    branches: [main]
    paths: &notify-paths
      - 'whip-notify/**'
      - '!**/*.md'
      - '.github/workflows/ci-whip-notify.yml'
      - '.github/workflows/release-whip-notify.yml'
      - 'scripts/prepare-notify-install-tag.sh'
      - 'rust-toolchain.toml'
      - 'packages/react-native-whip-ssh/rust/rust-toolchain.toml'
  pull_request:
    branches: [main]
    paths: *notify-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-whip-notify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Whip Notify checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: whip-notify

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: whip-notify

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test plugin and installer
        run: cargo test --locked --all-features

      - name: Check library without host features
        run: cargo check --locked --no-default-features --lib
