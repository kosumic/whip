name: EAS iOS Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.github/**'

permissions:
  contents: read

concurrency:
  group: eas-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Trigger production iOS build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: google-play
    env:
      NODE_ENV: production

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Trigger EAS production build
        run: >-
          eas build
          --platform ios
          --profile production
          --non-interactive
          --no-wait
          --message "GitHub Actions $GITHUB_SHA"
