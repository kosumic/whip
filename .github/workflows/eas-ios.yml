name: EAS iOS Build and Submit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eas-ios-app-store
  cancel-in-progress: false

jobs:
  build:
    name: Build and submit production iOS app
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # This existing shared environment also holds EXPO_TOKEN for iOS builds.
    environment: google-play
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/fastlane/Gemfile
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_HIDE_CHANGELOG: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@5273c2136bd09c2a341fe3340d3e767ce5a13015 # v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Check app version configuration
        run: npm run check:app-version

      - name: Set up App Store submission tools
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: fastlane

      - name: Verify App Store access before building
        env:
          APP_STORE_CONNECT_API_KEY_JSON: ${{ secrets.APP_STORE_CONNECT_API_KEY_JSON }}
        run: bundle exec fastlane ios validate_release

      - name: Build production iOS app
        id: build
        env:
          NODE_ENV: production
        run: |
          eas build \
            --platform ios \
            --profile production \
            --non-interactive \
            --wait \
            --json \
            --message "GitHub Actions $GITHUB_SHA" \
            > "$RUNNER_TEMP/eas-ios-build.json"
          build_id="$(jq -er '.[0].id' "$RUNNER_TEMP/eas-ios-build.json")"
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"

      - name: Upload iOS build to App Store Connect
        env:
          EAS_BUILD_ID: ${{ steps.build.outputs.build_id }}
        run: >-
          eas submit
          --platform ios
          --profile production
          --id "$EAS_BUILD_ID"
          --non-interactive
          --wait

      - name: Submit release to App Review
        env:
          APP_STORE_CONNECT_API_KEY_JSON: ${{ secrets.APP_STORE_CONNECT_API_KEY_JSON }}
        run: bundle exec fastlane ios submit_review
