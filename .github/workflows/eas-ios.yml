name: EAS iOS Build and Submit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eas-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and submit production iOS app
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: google-play

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Check app version configuration
        run: npm run check:app-version

      - name: Build production iOS app
        id: build
        env:
          NODE_ENV: production
        run: |
          eas build \
            --platform ios \
            --profile production \
            --non-interactive \
            --wait \
            --json \
            --message "GitHub Actions $GITHUB_SHA" \
            > "$RUNNER_TEMP/eas-ios-build.json"
          build_id="$(jq -er '.[0].id' "$RUNNER_TEMP/eas-ios-build.json")"
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"

      - name: Submit iOS app to App Store Connect
        env:
          EAS_BUILD_ID: ${{ steps.build.outputs.build_id }}
        run: >-
          eas submit
          --platform ios
          --profile production
          --id "$EAS_BUILD_ID"
          --non-interactive
          --wait
