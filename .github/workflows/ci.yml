name: CI

on:
  push:
    branches: [main]
    paths: &app-paths
      - '**'
      - '!whipair/**'
      - '!whip-notify/**'
      - '!launch-videos/**'
      - '!assets/screenshots/**'
      - '!fastlane/metadata/**'
      - '!feedback-worker/**'
      - '!notify-relay/**'
      - '!__tests__/feedbackWorker*.test.ts'
      - '!__tests__/notifyRelay*.test.ts'
      - '!jest.workers.config.js'
      - '!.github/workflows/ci-feedback-worker.yml'
      - '!.github/workflows/ci-notify-relay.yml'
      - '!.github/workflows/ci-whipair.yml'
      - '!.github/workflows/ci-whip-notify.yml'
      - '!.github/workflows/publish-whipair.yml'
      - '!.github/workflows/publish-whipair-packages.yml'
      - '!.github/workflows/publish-tailcat-client.yml'
      - '!.github/workflows/publish-whipair-protocol.yml'
      - '!.github/workflows/publish-agent-browser-control.yml'
      - '!.github/workflows/ci-agent-browser-control.yml'
      - '!.github/workflows/ci-agent-transcript-core.yml'
      - '!.github/workflows/publish-agent-transcript-core.yml'
      - '!.github/workflows/ci-herdr-protocol.yml'
      - '!.github/workflows/publish-herdr-protocol.yml'
      - '!.github/workflows/release-whip-notify.yml'
      - '!scripts/prepare-notify-install-tag.sh'
      - '!scripts/publish-crate-github-release.sh'
      # The app imports this library and embeds its platform detection script.
      - 'whip-notify/Cargo.toml'
      - 'whip-notify/src/**'
      - '!whip-notify/src/main.rs'
      - '!whip-notify/src/host.rs'
      - '!whip-notify/src/host/**'
      - 'whip-notify/platform.sh'
      - '!**/*.md'
  pull_request:
    branches: [main]
    paths: *app-paths
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Whip Rust core checks
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    # xn-gemm-f16 uses AArch64 FP16 SIMD inline asm; the runner supports FEAT_FP16,
    # but Rust's baseline AArch64 target does not enable it by default.
    # Keep this flag in the ARM64 test job, not in shipped mobile builds.
    env:
      RUSTFLAGS: -C target-feature=+fp16
    permissions:
      checks: write
      contents: read
    defaults:
      run:
        working-directory: packages/react-native-whip-ssh/rust

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - name: Install Go for Tailcat interoperability tests
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: crates/tailcat-client/tests/reference/go.mod
          cache-dependency-path: crates/tailcat-client/tests/reference/go.sum

      - name: Install local SSH fixture tools
        run: sudo apt-get update && sudo apt-get install --yes openssh-server netcat-openbsd

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: packages/react-native-whip-ssh/rust

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Lint Whip Rust core
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Check Tailcat client library
        working-directory: crates/tailcat-client
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/packages/react-native-whip-ssh/rust/target
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          bash tests/interop.sh

      - name: Check shared pairing protocol
        working-directory: crates/whipair-protocol
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/packages/react-native-whip-ssh/rust/target
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: Check shared agent transcript library
        working-directory: crates/agent-transcript-core
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/packages/react-native-whip-ssh/rust/target
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo run --locked --example ingest

      - name: Check shared Herdr protocol
        working-directory: crates/herdr-protocol
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/packages/react-native-whip-ssh/rust/target
        run: |
          node scripts/generate-hc.cjs --check
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo run --locked --example messages

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install browser test harness dependencies
        working-directory: ${{ github.workspace }}
        run: npm ci --ignore-scripts --include=dev

      - name: Test Whip Rust core
        # Host-runtime tests share process-wide event sinks.
        run: cargo test --locked -- --test-threads=1

      - name: Test real Herdr Core over SSH
        env:
          CORE_TEST_DIRECTORY: ${{ runner.temp }}/herdr-core-0.1.16
        run: |
          export WHIP_HC_TEST_BINARY="$(bash ../../../scripts/fetch-herdr-core-test.sh "$CORE_TEST_DIRECTORY")"
          cargo test --locked --lib hc_transport::tests::real_core_socket_multiplex_documents_reconnect_and_exec_fallback -- --ignored --test-threads=1

      - name: Test Tailcat against a local upstream relay and server
        run: bash tests/test-tailcat.sh

      - name: Test Tailcat-first-hop ProxyJump and recovery
        run: bash tests/test-tailcat-proxyjump.sh

      - name: Audit Rust dependencies
        uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432 # main
        with:
          token: ${{ github.token }}
          working-directory: packages/react-native-whip-ssh/rust

      - name: Test against live OpenSSH
        run: bash tests/live-ssh.sh

  javascript:
    name: JavaScript checks
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Check dependency tree
        run: npm ls --all --package-lock-only > /dev/null

      - name: Install dependencies
        run: npm ci

      - name: Check Expo dependencies
        run: npm run doctor

      - name: Check app version configuration
        run: npm run check:app-version

      - name: Check types
        run: |
          npx tsc --noEmit
          npm run check:scripts

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --runInBand

      - name: Test native Markdown parser
        run: bash scripts/test-native-markdown-parser.sh

      - name: Bundle production JavaScript for iOS
        run: npm run bundle:ios

  android:
    name: Android checks
    if: github.event_name != 'schedule' || github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
      security-events: write
    env:
      NODE_ENV: production
      CARGO_INCREMENTAL: '0'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK packages
        run: >-
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-36"
          "build-tools;36.0.0"
          "ndk;27.1.12297006"
          "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          dependency-graph: ${{ github.ref == 'refs/heads/main' && 'generate-and-upload' || 'disabled' }}
          dependency-graph-include-projects: '^:app$'
          dependency-graph-include-configurations: '^releaseRuntimeClasspath$'
          dependency-graph-continue-on-failure: false
          artifact-retention-days: 1

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Compute Android Rust cache key
        id: android-rust-key
        env:
          RUST_CACHE_ENVIRONMENT: ${{ hashFiles('flake.nix', 'flake.lock', 'packages/react-native-whip-ssh/rust/rust-toolchain.toml') }}
          RUST_CACHE_DEPENDENCIES: ${{ hashFiles('packages/react-native-whip-ssh/rust/Cargo.toml', 'packages/react-native-whip-ssh/rust/Cargo.lock', 'crates/*/Cargo.toml', 'whip-notify/Cargo.toml', 'package-lock.json', 'patches/uniffi-bindgen-react-native+*.patch') }}
        run: |
          android_cache_prefix="android-rust-v1-$RUNNER_OS-$RUNNER_ARCH-$RUST_CACHE_ENVIRONMENT"
          echo "cache-prefix=$android_cache_prefix" >> "$GITHUB_OUTPUT"
          echo "cache-key=$android_cache_prefix-$RUST_CACHE_DEPENDENCIES-$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      # Restore after npm ci, which replaces the UniFFI generator's directory.
      - name: Restore Android Rust builds
        id: android-rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: &android-rust-cache-paths |
            ~/.cargo/registry
            ~/.cargo/git
            packages/react-native-whip-ssh/rust/target
            node_modules/uniffi-bindgen-react-native/target
          key: ${{ steps.android-rust-key.outputs.cache-key }}
          restore-keys: ${{ steps.android-rust-key.outputs.cache-prefix }}-

      - name: Build Android Rust library and bindings
        run: nix develop .#default -c bash packages/react-native-whip-ssh/rust/build-android.sh

      # Preserve completed Rust builds even if Gradle later fails or times out.
      - name: Save Android Rust builds
        if: steps.android-rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: *android-rust-cache-paths
          key: ${{ steps.android-rust-cache.outputs.cache-primary-key }}

      - name: Initialize Java and Kotlin CodeQL
        if: github.event.repository.visibility == 'public'
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Run Android lint and build
        id: android-build
        run: >-
          nix develop .#default -c
          android/gradlew -p android
          :expo-whip-terminal-input:testDebugUnitTest
          app:checkAppVersion app:lintRelease app:assembleDebug
          app:dependencies --configuration releaseRuntimeClasspath
          -PreactNativeArchitectures=arm64-v8a
          -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
          --no-build-cache
          --no-daemon

      - name: Verify release dependency snapshot
        if: github.ref == 'refs/heads/main'
        env:
          DEPENDENCY_GRAPH_FILE: ${{ steps.android-build.outputs.dependency-graph-file }}
        run: test -s "$DEPENDENCY_GRAPH_FILE"

      - name: Verify debug APK version
        run: >-
          nix develop .#default -c bash scripts/verify-android-version.sh
          android/app/build/outputs/apk/debug/app-debug.apk

      - name: Analyze Java and Kotlin
        if: github.event.repository.visibility == 'public'
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:java-kotlin

  dependency-submission:
    name: Submit Gradle dependency graph
    needs: android
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      # Submit the Android build's snapshot without checking out or executing code.
      - name: Submit generated Gradle dependency graph
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          dependency-graph: download-and-submit
          dependency-graph-continue-on-failure: false
          cache-disabled: true

  ios:
    name: iOS unsigned compile check
    if: github.event_name != 'schedule'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      NODE_ENV: production
      # Keep both Cargo workspaces' outputs outside node_modules so npm ci
      # preserves the restored Rust library and UniFFI generator.
      CARGO_TARGET_DIR: ${{ github.workspace }}/build/ios-rust-target
      CARGO_INCREMENTAL: '0'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Report Apple toolchain versions
        id: apple-toolchain
        env:
          RUST_CACHE_ENVIRONMENT: ${{ hashFiles('flake.lock', 'packages/react-native-whip-ssh/rust/rust-toolchain.toml') }}
          RUST_CACHE_DEPENDENCIES: ${{ hashFiles('packages/react-native-whip-ssh/rust/Cargo.toml', 'packages/react-native-whip-ssh/rust/Cargo.lock', 'package-lock.json', 'patches/uniffi-bindgen-react-native+*.patch') }}
        run: |
          ios_xcode_version="$(xcodebuild -version)"
          printf '%s\n' "$ios_xcode_version"
          swift --version
          ios_xcode_hash="$(printf '%s\n' "$ios_xcode_version" | shasum -a 256 | cut -d ' ' -f 1)"
          ios_cache_prefix="ios-rust-v1-$RUNNER_OS-$RUNNER_ARCH-$RUST_CACHE_ENVIRONMENT-$ios_xcode_hash"
          echo "cache-prefix=$ios_cache_prefix" >> "$GITHUB_OUTPUT"
          echo "cache-key=$ios_cache_prefix-$RUST_CACHE_DEPENDENCIES-$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Restore iOS Rust builds
        id: ios-rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: ${{ steps.apple-toolchain.outputs.cache-key }}
          restore-keys: ${{ steps.apple-toolchain.outputs.cache-prefix }}-

      - name: Install dependencies
        run: nix develop .#default -c npm ci --include=dev

      # Save before Xcode runs so a later failure or timeout keeps this cache.
      - name: Save iOS Rust builds
        if: steps.ios-rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: ${{ steps.ios-rust-cache.outputs.cache-primary-key }}

      - name: Set up Ruby and CocoaPods
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Cache React Native downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/Library/Caches/ReactNative
          key: ios-react-native-downloads-v1-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: ios-react-native-downloads-v1-${{ runner.os }}-

      - name: Install CocoaPods
        working-directory: ios
        env:
          CURL_HOME: ${{ runner.temp }}/whip-curl
        run: |
          mkdir -p "$CURL_HOME"
          cat > "$CURL_HOME/.curlrc" <<'CURL'
          connect-timeout = 20
          max-time = 180
          speed-limit = 1024
          speed-time = 30
          retry = 3
          retry-all-errors
          retry-max-time = 240
          CURL
          bundle exec pod install

      - name: Test native browser, clipboard, and terminal input on iPhone simulator
        id: ios-native-tests
        run: |
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool NO
          nix develop .#default -c ruby scripts/test-ios-browser.rb

      - name: Upload failed iOS native test results
        if: failure() && steps.ios-native-tests.conclusion == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: whip-ios-native-test-results
          path: build/ios-browser-tests/DerivedData/Logs/Test/*.xcresult
          if-no-files-found: warn
          retention-days: 7

      - name: Compile and validate unsigned iOS device app
        run: |
          scripts/build-ios-app.sh \
            --unsigned \
            --derived-data "$RUNNER_TEMP/WhipDerivedData"
          app_path="$RUNNER_TEMP/WhipDerivedData/Build/Products/Release-iphoneos/HerdR.app"
          ditto -c -k --sequesterRsrc --keepParent \
            "$app_path" \
            "$RUNNER_TEMP/Whip-iOS-unsigned-compile-only.app.zip"

      - name: Upload compile-only iOS artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: whip-ios-unsigned-compile-only
          path: ${{ runner.temp }}/Whip-iOS-unsigned-compile-only.app.zip
          if-no-files-found: error
          retention-days: 7
