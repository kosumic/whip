name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: 1.98.0

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Whip Rust core checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      checks: write
      contents: read
    defaults:
      run:
        working-directory: packages/react-native-whip-ssh/rust

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy --component rustfmt

      - name: Install cargo-about
        uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # v2.87.11
        with:
          tool: cargo-about@0.9.1
          fallback: none

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: packages/react-native-whip-ssh/rust

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Lint Whip Rust core
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Lint WhipAir
        working-directory: ${{ github.workspace }}/whipair
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test Whip Rust core
        run: cargo test --locked

      - name: Audit Rust dependencies
        uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432 # main
        with:
          token: ${{ github.token }}
          working-directory: packages/react-native-whip-ssh/rust

      - name: Test against live OpenSSH
        run: bash tests/live-ssh.sh

      - name: Check Rust license notices
        working-directory: ${{ github.workspace }}
        run: npm run check:cargo-license-notices

  javascript:
    name: JavaScript checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Expo dependencies
        run: npm run doctor

      - name: Check types
        run: npx tsc --noEmit

      - name: Check feedback Worker
        run: npm run worker:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --runInBand

      - name: Bundle production JavaScript for iOS
        run: npm run bundle:ios

      - name: Check npm license notices
        run: npm run check:npm-license-notices

  android:
    name: Android checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: production

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK packages
        run: >-
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-36"
          "build-tools;36.0.0"
          "ndk;27.1.12297006"
          "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Run Android lint and build
        run: >-
          nix develop .#default -c
          android/gradlew -p android
          app:lintRelease app:assembleDebug
          -PreactNativeArchitectures=arm64-v8a
          --no-daemon

  ios:
    name: iOS unsigned compile check
    runs-on: macos-26
    timeout-minutes: 45
    env:
      NODE_ENV: production

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Report Apple toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: nix develop .#default -c npm ci --include=dev

      - name: Set up Ruby and CocoaPods
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Install CocoaPods
        working-directory: ios
        run: bundle exec pod install

      - name: Compile and validate unsigned iOS device app
        run: |
          scripts/build-ios-app.sh \
            --unsigned \
            --derived-data "$RUNNER_TEMP/WhipDerivedData"
          app_path="$RUNNER_TEMP/WhipDerivedData/Build/Products/Release-iphoneos/HerdR.app"
          ditto -c -k --sequesterRsrc --keepParent \
            "$app_path" \
            "$RUNNER_TEMP/Whip-iOS-unsigned-compile-only.app.zip"

      - name: Upload compile-only iOS artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: whip-ios-unsigned-compile-only
          path: ${{ runner.temp }}/Whip-iOS-unsigned-compile-only.app.zip
          if-no-files-found: error
          retention-days: 7

  ios-xcframework:
    name: iOS Rust XCFramework

    runs-on: macos-26
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned Rust toolchain and iOS targets
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Cache Rust iOS builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: packages/react-native-whip-ssh/rust
          key: ios-xcframework

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install native binding generator
        run: npm ci --ignore-scripts

      - name: Validate merged Whip Rust XCFramework
        run: |
          scripts/build-ios-uniffi.sh
          test -d packages/react-native-whip-ssh/build/WhipSsh.xcframework
