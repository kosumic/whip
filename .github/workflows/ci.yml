name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: 1.99.0

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Whip Rust core checks
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      checks: write
      contents: read
    defaults:
      run:
        working-directory: packages/react-native-whip-ssh/rust

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy --component rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: packages/react-native-whip-ssh/rust

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Lint Whip Rust core
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Lint WhipAir
        working-directory: ${{ github.workspace }}/whipair
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install browser test harness dependencies
        working-directory: ${{ github.workspace }}
        run: npm ci --ignore-scripts --include=dev

      - name: Test Whip Rust core
        run: cargo test --locked

      - name: Audit Rust dependencies
        uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432 # main
        with:
          token: ${{ github.token }}
          working-directory: packages/react-native-whip-ssh/rust

      - name: Test against live OpenSSH
        run: bash tests/live-ssh.sh

  javascript:
    name: JavaScript checks
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Expo dependencies
        run: npm run doctor

      - name: Check app version configuration
        run: npm run check:app-version

      - name: Check types
        run: npx tsc --noEmit

      - name: Check feedback Worker
        run: npm run worker:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --runInBand

      - name: Bundle production JavaScript for iOS
        run: npm run bundle:ios

  android:
    name: Android checks
    if: github.event_name != 'schedule' || github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
      security-events: write
    env:
      NODE_ENV: production

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK packages
        run: >-
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-36"
          "build-tools;36.0.0"
          "ndk;27.1.12297006"
          "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          dependency-graph: ${{ github.ref == 'refs/heads/main' && 'generate-and-upload' || 'disabled' }}
          dependency-graph-include-projects: '^:app$'
          dependency-graph-include-configurations: '^releaseRuntimeClasspath$'
          dependency-graph-continue-on-failure: false
          artifact-retention-days: 1

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Initialize Java and Kotlin CodeQL
        if: github.event.repository.visibility == 'public'
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Run Android lint and build
        id: android-build
        run: >-
          nix develop .#default -c
          android/gradlew -p android
          app:checkAppVersion app:lintRelease app:assembleDebug
          app:dependencies --configuration releaseRuntimeClasspath
          -PreactNativeArchitectures=arm64-v8a
          --no-build-cache
          --no-daemon

      - name: Verify release dependency snapshot
        if: github.ref == 'refs/heads/main'
        env:
          DEPENDENCY_GRAPH_FILE: ${{ steps.android-build.outputs.dependency-graph-file }}
        run: test -s "$DEPENDENCY_GRAPH_FILE"

      - name: Verify debug APK version
        run: >-
          nix develop .#default -c bash scripts/verify-android-version.sh
          android/app/build/outputs/apk/debug/app-debug.apk

      - name: Analyze Java and Kotlin
        if: github.event.repository.visibility == 'public'
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: /language:java-kotlin

  dependency-submission:
    name: Submit Gradle dependency graph
    needs: android
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      # Submit the Android build's snapshot without checking out or executing code.
      - name: Submit generated Gradle dependency graph
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          dependency-graph: download-and-submit
          dependency-graph-continue-on-failure: false
          cache-disabled: true

  ios:
    name: iOS unsigned compile check
    if: github.event_name != 'schedule'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      NODE_ENV: production

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Report Apple toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: nix develop .#default -c npm ci --include=dev

      - name: Set up Ruby and CocoaPods
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Install CocoaPods
        working-directory: ios
        run: bundle exec pod install

      - name: Compile and validate unsigned iOS device app
        run: |
          scripts/build-ios-app.sh \
            --unsigned \
            --derived-data "$RUNNER_TEMP/WhipDerivedData"
          app_path="$RUNNER_TEMP/WhipDerivedData/Build/Products/Release-iphoneos/HerdR.app"
          ditto -c -k --sequesterRsrc --keepParent \
            "$app_path" \
            "$RUNNER_TEMP/Whip-iOS-unsigned-compile-only.app.zip"

      - name: Upload compile-only iOS artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: whip-ios-unsigned-compile-only
          path: ${{ runner.temp }}/Whip-iOS-unsigned-compile-only.app.zip
          if-no-files-found: error
          retention-days: 7
