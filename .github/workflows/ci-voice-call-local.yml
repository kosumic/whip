name: Local voice call CI

on:
  push:
    branches: [main]
    paths: &call-paths
      - 'crates/voice-call-local/**'
      - '.github/workflows/ci-voice-call-local.yml'
      - 'rust-toolchain.toml'
  pull_request:
    branches: [main]
    paths: *call-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-voice-call-local-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Standalone crate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: crates/voice-call-local
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint default and optional policy
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test without platform SDKs or models
        run: |
          cargo test --locked
          cargo test --locked --all-features
          cargo run --locked --example local
      - name: Verify standalone package
        run: cargo package --locked
