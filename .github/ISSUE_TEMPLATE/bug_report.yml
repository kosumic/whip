name: Bug report
description: Report a reproducible problem in Whip
title: 'bug: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Use this form for reproducible problems in Whip on Android, iOS, or iPadOS.

        Never include passwords, private keys, Tailnet IP addresses, or sensitive terminal output. Report security problems privately through the repository Security tab.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and Discussions for this problem.
          required: true
        - label: I reproduced the problem on the latest version available from my installation source.
          required: true
        - label: I removed credentials and sensitive host or terminal data.
          required: true
  - type: input
    id: build
    attributes:
      label: Whip version
      description: Find the version in More → About. Include the commit SHA if available.
      placeholder: 1.9.1, commit abc1234
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation source
      options:
        - Google Play
        - App Store
        - TestFlight
        - GitHub release
        - Built from source
        - Other / unknown
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS
        - iPadOS
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS version
      description: Manufacturer, model, and Android, iOS, or iPadOS version. Include CPU architecture if known.
      placeholder: Google Pixel 8, Android 16, arm64-v8a; or iPhone 17 Pro, iOS 26
    validations:
      required: true
  - type: input
    id: herdr
    attributes:
      label: Herdr version
      description: Optional. Include this for Herdr-related problems; leave blank for plain SSH or unrelated issues.
      placeholder: Output of herdr --version
  - type: dropdown
    id: auth
    attributes:
      label: SSH authentication
      options:
        - Password
        - Private key without passphrase
        - Private key with passphrase
        - Not connection-related
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: Provide the smallest reliable sequence that demonstrates the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Drag files here or paste redacted text. Do not include secrets or private terminal output.
      render: shell
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include whether the equivalent SSH/Herdr command works outside Whip.
